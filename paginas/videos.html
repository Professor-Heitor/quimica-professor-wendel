        <button onclick="abrirPainelAdicionar()" id="btn-novo-vid" style="background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; display: none;">➕ Novo Vídeo</button>

</div>

<div id="painel-admin" style="display: none; background: #18181b; border: 1px solid #7c3aed; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h3 style="color: #c084fc; margin: 0;">➕ Adicionar Novo Vídeo</h3>
        <button onclick="sairModoProfessor()" style="background: #374151; color: #f87171; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">🔒 Sair do modo Professor</button>
    </div>
    <div style="display: grid; gap: 8px;">
        <select id="novo-categoria" style="padding: 6px; border-radius: 4px; border: 1px solid #555; background: #222; color: white;">
            <option value="6º Ano - Química Básica">🟢 6º Ano - Química Básica</option>
            <option value="7º Ano - Átomos">🟡 7º Ano - Átomos</option>
            <option value="8º Ano - Tabela Periódica e Ligações">🟠 8º Ano - Tabela Periódica e Ligações</option>
            <option value="9º Ano - Química Avançada">🔴 9º Ano - Química Avançada</option>
            <option value="Ensino Médio">🔵 Ensino Médio</option>
        </select>
        <input type="text" id="novo-titulo" placeholder="Título do Vídeo (ex: Átomos e Moléculas)" style="padding: 6px; border-radius: 4px; border: 1px solid #555; background: #222; color: white;">
        <input type="text" id="novo-link" placeholder="Link normal do YouTube (ex: https://www.youtube.com/watch?v=...)" style="padding: 6px; border-radius: 4px; border: 1px solid #555; background: #222; color: white;">
        <textarea id="novo-descricao" placeholder="Breve descrição do vídeo..." rows="2" style="padding: 6px; border-radius: 4px; border: 1px solid #555; background: #222; color: white; resize: vertical;"></textarea>
        <button onclick="salvarNovoVideo()" style="background: #16a34a; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold;">Salvar e Publicar Vídeo</button>

</div>

<script>
const videosPadrao = [
    // 6 ANO
    { id: 'vid-1', categoria: '6º Ano - Química Básica', titulo: 'Substâncias e Misturas', video: 'https://www.youtube.com/embed/hbwKwNhIFM4', descricao: 'Introdução à Química, matéria, objetos e substâncias.' },
    { id: 'vid-2', categoria: '6º Ano - Química Básica', titulo: 'Tipos de Misturas', video: 'https://www.youtube.com/embed/L7cfPRNIfxQ', descricao: 'Misturas homogêneas e heterogêneas.' },
    { id: 'vid-3', categoria: '6º Ano - Química Básica', titulo: 'Mistura Homogênea e Heterogênea', video: 'https://www.youtube.com/embed/2zU_3ganVj4', descricao: 'Diferenças entre tipos de misturas.' },
    
    // 7 ANO
    { id: 'vid-4', categoria: '7º Ano - Átomos', titulo: 'Estrutura Atômica', video: 'https://www.youtube.com/embed/jPL78QD6hBk', descricao: 'Como é formado o átomo?' },
    { id: 'vid-5', categoria: '7º Ano - Átomos', titulo: 'Prótons, Nêutrons e Elétrons', video: 'https://www.youtube.com/embed/eav23HYcowI', descricao: 'Partículas presentes no átomo.' },

    // 8 ANO
    { id: 'vid-6', categoria: '8º Ano - Tabela Periódica e Ligações', titulo: 'Tabela Periódica', video: 'https://www.youtube.com/embed/Vsnq2hJ2UZc', descricao: 'Famílias, períodos e elementos químicos.' },
    { id: 'vid-7', categoria: '8º Ano - Tabela Periódica e Ligações', titulo: 'Ligações Químicas', video: 'https://www.youtube.com/embed/99b6_HneB64', descricao: 'Formação de moléculas e ligações.' },

    // 9 ANO
    { id: 'vid-8', categoria: '9º Ano - Química Avançada', titulo: 'Reações Químicas e Balanceamento', video: 'https://www.youtube.com/embed/O9vPOw9dvM8', descricao: 'Reagentes, produtos e equações químicas.' },
    { id: 'vid-9', categoria: '9º Ano - Química Avançada', titulo: 'Balanceamento de Equações', video: 'https://www.youtube.com/embed/yF8o5vTOGc4', descricao: 'Como equilibrar uma reação química.' },

    // ENSINO MEDIO
    { id: 'vid-10', categoria: 'Ensino Médio', titulo: 'Modelos Atômicos', video: 'https://www.youtube.com/embed/5-fa4IKp5bU', descricao: 'Modelos atômicos e evolução da ciência.' },
    { id: 'vid-11', categoria: 'Ensino Médio', titulo: 'Termoquímica', video: 'https://www.youtube.com/embed/Phr3DSKLLhA', descricao: 'Energia nas reações químicas.' },
    { id: 'vid-12', categoria: 'Ensino Médio', titulo: 'Eletroquímica', video: 'https://www.youtube.com/embed/-RU1ywag0Dg', descricao: 'Pilhas, eletrólise e oxirredução.' }
];

document.addEventListener("DOMContentLoaded", function() {
    carregarVideos();
    verificarEstadoProfessorInicial();
});

function verificarSeProfessor() {
    return sessionStorage.getItem('professor_autenticado') === 'true';
}

function verificarEstadoProfessorInicial() {
    if (verificarSeProfessor()) {
        document.getElementById('btn-painel-toggle').style.background = '#16a34a';
        document.getElementById('btn-painel-toggle').innerText = '🔓 Painel do Professor (Ativo)';
        document.getElementById('btn-novo-vid').style.display = 'block';
    } else {
        document.getElementById('btn-novo-vid').style.display = 'none';
    }
}

function alternarPainelAdmin() {
    let painel = document.getElementById('painel-admin');
    
    if (!verificarSeProfessor()) {
        let senha = prompt("Digite a senha do Professor:");
        if (senha === "@WENDELquimica26") {
            sessionStorage.setItem('professor_autenticado', 'true');
            document.getElementById('btn-painel-toggle').style.background = '#16a34a';
            document.getElementById('btn-painel-toggle').innerText = '🔓 Painel do Professor (Ativo)';
            document.getElementById('btn-novo-vid').style.display = 'block';
            carregarVideos(); 
        } else if (senha !== null) {
            alert("Senha incorreta!");
            return;
        } else {
            return;
        }
    }

    painel.style.display = painel.style.display === "none" ? "block" : "none";
}

function abrirPainelAdicionar() {
    if (!verificarSeProfessor()) {
        if (!pedirSenhaOuLiberar()) return;
    }
    let painel = document.getElementById('painel-admin');
    painel.style.display = "block";
    painel.scrollIntoView({ behavior: 'smooth' });
}

function sairModoProfessor() {
    sessionStorage.removeItem('professor_autenticado');
    document.getElementById('painel-admin').style.display = 'none';
    document.getElementById('btn-painel-toggle').style.background = '#7c3aed';
    document.getElementById('btn-painel-toggle').innerText = '🔐 Painel do Professor';
    document.getElementById('btn-novo-vid').style.display = 'none';
    carregarVideos();
}

function pedirSenhaOuLiberar() {
    if (verificarSeProfessor()) return true;

    let senha = prompt("Digite a senha do Professor:");
    if (senha === "1234") {
        sessionStorage.setItem('professor_autenticado', 'true');
        document.getElementById('btn-painel-toggle').style.background = '#16a34a';
        document.getElementById('btn-painel-toggle').innerText = '🔓 Painel do Professor (Ativo)';
        document.getElementById('btn-novo-vid').style.display = 'block';
        carregarVideos();
        return true;
    } else if (senha !== null) {
        alert("Senha incorreta!");
    }
    return false;
}

function converterParaEmbed(url) {
    if (!url) return "";
    if (url.includes('/embed/')) return url;

    let videoId = "";
    if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1]?.split('?')[0];
    } else if (url.includes('watch?v=')) {
        videoId = url.split('watch?v=')[1]?.split('&')[0];
    }

    if (videoId) {
        return "https://www.youtube.com/embed/" + videoId;
    }
    return url;
}

function obterVideos() {
    let salvos = localStorage.getItem('lista_videos_cadastrados');
    if (!salvos) {
        localStorage.setItem('lista_videos_cadastrados', JSON.stringify(videosPadrao));
        return videosPadrao;
    }
    return JSON.parse(salvos);
}

function carregarVideos() {
    let containerPrincipal = document.getElementById('container-categorias-videos');
    containerPrincipal.innerHTML = "";
    let videos = obterVideos();
    let eProfessor = verificarSeProfessor();

    let categoriasOrdem = [
        '6º Ano - Química Básica',
        '7º Ano - Átomos',
        '8º Ano - Tabela Periódica e Ligações',
        '9º Ano - Química Avançada',
        'Ensino Médio'
    ];

    categoriasOrdem.forEach(catNome => {
        let videosDaCategoria = videos.filter(v => v.categoria === catNome);
        if (videosDaCategoria.length === 0) return;

        let secao = document.createElement('section');
        
        let tituloSecao = document.createElement('h2');
        tituloSecao.innerText = catNome;
        tituloSecao.style.marginBottom = "10px";
        secao.appendChild(tituloSecao);

        let gridDiv = document.createElement('div');
        gridDiv.className = 'container';

        videosDaCategoria.forEach(vid => {
            let cardDiv = document.createElement('div');
            cardDiv.className = "card";

            let likes = localStorage.getItem(vid.id + '_likes') || '0';
            let curtido = localStorage.getItem(vid.id + '_curtido') === 'true';
            let corBtnCurtir = curtido ? '#dc2626' : '#2563eb';
            let linkVideoEmbed = converterParaEmbed(vid.video);

            let botoesAdminHtml = eProfessor ? `
                <div>
                    <button onclick="editarVideo('${vid.id}')" style="background: #374151; color: white; border: none; padding: 2px 5px; border-radius: 3px; cursor: pointer; font-size: 11px;">✏️ Editar</button>
                    <button onclick="excluirVideo('${vid.id}')" style="background: #b91c1c; color: white; border: none; padding: 2px 5px; border-radius: 3px; cursor: pointer; font-size: 11px;">🗑️ Excluir</button>
                </div>
            ` : '';

            cardDiv.innerHTML = `
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px;">
                        <h3 style="margin-top: 0; margin-bottom: 6px; color: #fff; font-size: 16px;">${vid.titulo}</h3>
                        ${botoesAdminHtml}
                    </div>

                    <iframe width="100%" height="180" src="${linkVideoEmbed}" style="border: none; border-radius: 4px;" allowfullscreen></iframe>

                    <p style="margin-top: 8px; margin-bottom: 0; font-size: 14px;">${vid.descricao}</p>
                </div>

                <!-- Seção de Curtir e Comentar -->
                <div class="secao-comentarios-card">
                    <button id="btn-${vid.id}" onclick="curtir('${vid.id}')" style="background: ${corBtnCurtir}; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;" data-curtido="${curtido}">❤️ Curtir (<span id="likes-${vid.id}">${likes}</span>)</button>
                    <div style="margin-top: 8px;">
                        <div class="form-inputs-comentario">
                            <input type="text" id="autor-${vid.id}" placeholder="Seu nome..." style="width: 32%; padding: 4px 6px; border-radius: 4px; border: 1px solid #555; background: #222; color: white; font-size: 13px;">
                            <input type="text" id="input-${vid.id}" placeholder="Escreva um comentário..." onkeypress="verificarEnter(event, 'autor-${vid.id}', 'input-${vid.id}', '${vid.id}')" style="width: 66%; padding: 4px 6px; border-radius: 4px; border: 1px solid #555; background: #222; color: white; font-size: 13px;">
                        </div>
                        <button onclick="comentar('autor-${vid.id}', 'input-${vid.id}', '${vid.id}')" style="background: #16a34a; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 4px; font-size: 13px;">Enviar Comentário</button>
                    </div>
                    <div id="lista-${vid.id}" style="margin-top: 8px; text-align: left;"></div>
                </div>
            `;

            gridDiv.appendChild(cardDiv);
            carregarComentariosDoCard(vid.id);
        });

        secao.appendChild(gridDiv);
        containerPrincipal.appendChild(secao);
    });
}

function salvarNovoVideo() {
    let categoria = document.getElementById('novo-categoria').value;
    let titulo = document.getElementById('novo-titulo').value.trim();
    let video = document.getElementById('novo-link').value.trim();
    let descricao = document.getElementById('novo-descricao').value.trim();

    if (!titulo || !video) {
        alert("Preencha pelo menos o Título e o Link do Vídeo!");
        return;
    }

    let videos = obterVideos();
    let novoId = 'vid-' + new Date().getTime();

    videos.push({
        id: novoId,
        categoria: categoria,
        titulo: titulo,
        video: video,
        descricao: descricao
    });

    localStorage.setItem('lista_videos_cadastrados', JSON.stringify(videos));

    document.getElementById('novo-titulo').value = '';
    document.getElementById('novo-link').value = '';
    document.getElementById('novo-descricao').value = '';
    document.getElementById('painel-admin').style.display = 'none';

    carregarVideos();
}

function excluirVideo(idVid) {
    if (!pedirSenhaOuLiberar()) return;

    if (confirm("Tem certeza que deseja apagar este vídeo?")) {
        let videos = obterVideos();
        let filtrados = videos.filter(v => v.id !== idVid);
        localStorage.setItem('lista_videos_cadastrados', JSON.stringify(filtrados));
        carregarVideos();
    }
}

function editarVideo(idVid) {
    if (!pedirSenhaOuLiberar()) return;

    let videos = obterVideos();
    let vid = videos.find(v => v.id === idVid);
    if (!vid) return;

    let novoTitulo = prompt("Edite o Título:", vid.titulo);
    if (novoTitulo === null) return;
    
    let novoLink = prompt("Edite o Link do YouTube:", vid.video);
    if (novoLink === null) return;
    
    let novaDescricao = prompt("Edite a Descrição:", vid.descricao);
    if (novaDescricao === null) return;

    vid.titulo = novoTitulo;
    vid.video = novoLink;
    vid.descricao = novaDescricao;

    localStorage.setItem('lista_videos_cadastrados', JSON.stringify(videos));
    carregarVideos();
}

function curtir(idVid) {
    let span = document.getElementById('likes-' + idVid);
    let btn = document.getElementById('btn-' + idVid);
    let atual = parseInt(span.innerText);
    let curtido = btn.dataset.curtido === 'true';

    if (curtido) {
        atual -= 1;
        btn.dataset.curtido = 'false';
        btn.style.background = '#2563eb';
    } else {
        atual += 1;
        btn.dataset.curtido = 'true';
        btn.style.background = '#dc2626';
    }

    span.innerText = atual;
    localStorage.setItem(idVid + '_likes', atual);
    localStorage.setItem(idVid + '_curtido', btn.dataset.curtido);
}

function comentar(idAutorElem, idInputElem, idVid) {
    let inputAutor = document.getElementById(idAutorElem);
    let inputTexto = document.getElementById(idInputElem);
    
    let autor = inputAutor.value.trim();
    if (autor === "") {
        autor = "Visitante";
    }
    
    let texto = inputTexto.value.trim();
    
    if (texto !== "") {
        let timestampAtual = new Date().getTime();
        let comentariosSalvos = JSON.parse(localStorage.getItem(idVid + '_comentarios')) || [];
        
        comentariosSalvos.push({ autor: autor, texto: texto, timestamp: timestampAtual });
        localStorage.setItem(idVid + '_comentarios', JSON.stringify(comentariosSalvos));

        recarregarListaComentarios(idVid);

        inputTexto.value = "";
        inputAutor.value = "";
    }
}

function verificarEnter(event, idAutorElem, idInputElem, idVid) {
    if (event.key === 'Enter') {
        event.preventDefault();
        comentar(idAutorElem, idInputElem, idVid);
    }
}

function editarComentario(idVid, index) {
    let comentariosSalvos = JSON.parse(localStorage.getItem(idVid + '_comentarios')) || [];
    let comentarioAtual = comentariosSalvos[index];

    let novoTexto = prompt("Edite seu comentário:", comentarioAtual.texto);
    if (novoTexto !== null && novoTexto.trim() !== "") {
        comentariosSalvos[index].texto = novoTexto.trim();
        localStorage.setItem(idVid + '_comentarios', JSON.stringify(comentariosSalvos));
        recarregarListaComentarios(idVid);
    }
}

function excluirComentario(idVid, index) {
    if (!verificarSeProfessor()) {
        alert("Apenas o Professor pode apagar comentários. Ative o Painel do Professor primeiro!");
        return;
    }

    if (confirm("Tem certeza que deseja apagar este comentário?")) {
        let comentariosSalvos = JSON.parse(localStorage.getItem(idVid + '_comentarios')) || [];
        comentariosSalvos.splice(index, 1);
        localStorage.setItem(idVid + '_comentarios', JSON.stringify(comentariosSalvos));
        recarregarListaComentarios(idVid);
    }
}

function carregarComentariosDoCard(idVid) {
    let lista = document.getElementById('lista-' + idVid);
    if (!lista) return;
    lista.innerHTML = "";

    let dadosSalvos = JSON.parse(localStorage.getItem(idVid + '_comentarios')) || [];
    dadosSalvos.forEach((item, index) => {
        let autor = item.autor;
        if (!autor || autor === "undefined" || autor.trim() === "") {
            autor = "Visitante";
        }
        let tempoFormatado = calcularTempoRelativo(item.timestamp || new Date().getTime());
        adicionarElementoComentario(lista, autor, item.texto, tempoFormatado, idVid, index);
    });
}

function recarregarListaComentarios(idVid) {
    carregarComentariosDoCard(idVid);
}

function calcularTempoRelativo(timestamp) {
    let agora = new Date().getTime();
    let diferencaSegundos = Math.floor((agora - timestamp) / 1000);

    if (diferencaSegundos < 60) return "agora mesmo";
    let diferencaMinutos = Math.floor(diferencaSegundos / 60);
    if (diferencaMinutos < 60) return "há " + diferencaMinutos + (diferencaMinutos === 1 ? " minuto" : " minutos");
    let diferencaHoras = Math.floor(diferencaMinutos / 60);
    if (diferencaHoras < 24) return "há " + diferencaHoras + (diferencaHoras === 1 ? " hora" : " horas");
    let diferencaDias = Math.floor(diferencaHoras / 24);
    return "há " + diferencaDias + (diferencaDias === 1 ? " dia" : " dias");
}

function adicionarElementoComentario(lista, autor, texto, tempo, idVid, index) {
    let eProfessor = verificarSeProfessor();

    let novoComentario = document.createElement("div");
    novoComentario.style.background = "#2a2a2a";
    novoComentario.style.borderLeft = "4px solid #16a34a";
    novoComentario.style.padding = "6px 8px";
    novoComentario.style.borderRadius = "4px";
    novoComentario.style.marginTop = "4px";
    novoComentario.style.fontSize = "13px";

    let cabecalho = document.createElement("div");
    cabecalho.style.display = "flex";
    cabecalho.style.justifyContent = "space-between";
    cabecalho.style.marginBottom = "2px";

    let autorSpan = document.createElement("span");
    autorSpan.innerText = "👤 " + autor;
    autorSpan.style.fontWeight = "bold";
    autorSpan.style.color = "#4ade80";

    let horaSpan = document.createElement("span");
    horaSpan.innerText = tempo;
    horaSpan.style.fontSize = "10px";
    horaSpan.style.color = "#aaa";

    cabecalho.appendChild(autorSpan);
    cabecalho.appendChild(horaSpan);

    let corpo = document.createElement("div");
    corpo.style.display = "flex";
    corpo.style.justifyContent = "space-between";
    corpo.style.alignItems = "center";

    let textoSpan = document.createElement("span");
    textoSpan.innerText = texto;
    textoSpan.style.wordBreak = "break-word";
    textoSpan.style.marginRight = "8px";
    textoSpan.style.color = "#fff";

    let acoesDiv = document.createElement("div");
    acoesDiv.style.display = "flex";
    acoesDiv.style.gap = "4px";
    acoesDiv.style.whiteSpace = "nowrap";

    let btnEditar = document.createElement("button");
    btnEditar.innerText = "✏️";
    btnEditar.style.background = "#374151";
    btnEditar.style.color = "white";
    btnEditar.style.border = "none";
    btnEditar.style.padding = "2px 5px";
    btnEditar.style.borderRadius = "3px";
    btnEditar.style.cursor = "pointer";
    btnEditar.style.fontSize = "10px";
    btnEditar.title = "Editar comentário";
    btnEditar.onclick = function() {
        editarComentario(idVid, index);
    };
    acoesDiv.appendChild(btnEditar);

    if (eProfessor) {
        let btnExcluir = document.createElement("button");
        btnExcluir.innerText = "🗑️";
        btnExcluir.style.background = "#b91c1c";
        btnExcluir.style.color = "white";
        btnExcluir.style.border = "none";
        btnExcluir.style.padding = "2px 5px";
        btnExcluir.style.borderRadius = "3px";
        btnExcluir.style.cursor = "pointer";
        btnExcluir.style.fontSize = "10px";
        btnExcluir.title = "Apagar comentário (Modo Professor)";
        btnExcluir.onclick = function() {
            excluirComentario(idVid, index);
        };
        acoesDiv.appendChild(btnExcluir);
    }

    corpo.appendChild(textoSpan);
    corpo.appendChild(acoesDiv);

    novoComentario.appendChild(cabecalho);
    novoComentario.appendChild(corpo);
    lista.appendChild(novoComentario);
}
</script>

</body>

</html>
