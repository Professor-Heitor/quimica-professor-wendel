/* =========================================================
   PROFESSOR
========================================================= */

async function ehProfessor() {

    try {

        const {
            data: { user }
        } = await db.auth.getUser();

        if (!user) return false;

        /*
         * Primeiro verifica role no metadata.
         * Isso evita considerar qualquer usuário logado como professor.
         */

        if (
            user.app_metadata?.role === "professor" ||
            user.user_metadata?.role === "professor"
        ) {
            return true;
        }

        /*
         * Caso exista uma tabela professores configurada,
         * também tenta verificar o usuário nela.
         */

        try {

            const { data } = await db
                .from("professores")
                .select("id")
                .eq("user_id", user.id)
                .maybeSingle();

            if (data) return true;

        } catch (erroTabela) {
            console.warn("Tabela professores não disponível.");
        }

        return false;

    } catch (erro) {

        console.error(erro);

        return false;

    }

}


async function verificarEstadoProfessorInicial() {

    const professor = await ehProfessor();

    const botao = document.getElementById("btn-painel-toggle");
    const novoVideo = document.getElementById("btn-novo-vid");

    if (professor) {

        botao.style.background = "#16a34a";
        botao.innerText = "🔓 Painel do Professor (Ativo)";

    } else {

    }

}

        if (!session) {

            window.location.href =
                "../login.html?redirect=paginas/videos.html";

            return;

        }

        alert("Sua conta não possui permissão de professor.");

        return;
    }

    const painel = document.getElementById("painel-admin");

    painel.style.display =
        painel.style.display === "none"

}


async function abrirPainelAdicionar() {

    const painel =

    painel.style.display = "block";

}


/* =========================================================
   BANCO DE VÍDEOS
========================================================= */

async function inicializarBancoVideos() {

    try {

        const {
            data,
            error
        } = await db
            .from("videos")
            .select("*");

        if (error) {

            console.warn("Não foi possível consultar vídeos.");

            return;

        }

        if (!data || data.length === 0) {

            /*
             * Insere os vídeos padrão sem campo de curtidas.
             * As curtidas ficam na tabela likes.
             */

            for (const video of videosPadrao) {

                const { id, categoria, titulo, video: link, descricao } = video;

                await db
                    .from("videos")
                    .insert([{
                        id,
                        categoria,
                        titulo,
                        video: link,
                        descricao
                    }]);

            }

        }

    } catch (erro) {

        console.warn("Banco de vídeos indisponível.");

    }

}


async function obterVideos() {

    try {

        const {
            data,
            error
        } = await db
            .from("videos")
            .select("*");

        if (error || !data || data.length === 0) {

            return videosPadrao;

        }

        return data;

    } catch {

        return videosPadrao;

    }

}


/* =========================================================
   EMBED YOUTUBE
========================================================= */

function converterParaEmbed(url) {

    if (!url) return "";

    if (url.includes("/embed/")) {
        return url;
    }

    let videoId = "";

    if (url.includes("youtu.be/")) {

        videoId =
            url
                .split("youtu.be/")[1]
                ?.split("?")[0];

    } else if (url.includes("watch?v=")) {

        videoId =
            url
                .split("watch?v=")[1]
                ?.split("&")[0];

    }

    if (videoId) {

        return "https://www.youtube.com/embed/" + videoId;

    }

    return url;

}


/* =========================================================
   CURTIDAS
========================================================= */

function chaveLike(id) {

    return "video:" + id;

}


async function obterLikes(id) {

    try {

        const {
            count,
            error
        } = await db
            .from("likes")
            .select("id", {
                count: "exact",
                head: true
            })
            .eq("item_id", chaveLike(id));

        if (error) {

            console.warn("Erro ao carregar likes:", error);

            return 0;

        }

        return count || 0;

    } catch {

        return 0;

    }

}


async function atualizarLike(id) {

    const quantidade =
        await obterLikes(id);

    const span =
        document.getElementById("likes-" + id);

    if (span) {

        span.innerText = quantidade;

    }

}


async function curtir(id) {

    const chave =
        "like_video_" + id;

    if (localStorage.getItem(chave) === "true") {

        alert("Você já curtiu este vídeo neste navegador.");

        return;

    }

    const { error } =
        await db
            .from("likes")
            .insert([{
                item_id: chaveLike(id)
            }]);

    if (error) {

        alert("Não foi possível registrar a curtida.");

        console.error(error);

        return;

    }

    localStorage.setItem(chave, "true");

    await atualizarLike(id);

    const botao =
        document.getElementById("btn-" + id);

    if (botao) {

        botao.style.background = "#dc2626";

    }

}


/* =========================================================
   CARREGAR VÍDEOS
========================================================= */

async function carregarVideos() {

    container.innerHTML = "";

    const videos =

    const professor =
        await ehProfessor();

        "7º Ano - Átomos",

        "8º Ano - Tabela Periódica e Ligações",

        "Ensino Médio"

        const videosDaCategoria =
            videos.filter(
                video =>
                    video.categoria === categoria
            );

            continue;
        }

            document.createElement("h2");

                document.createElement("div");

            const likes =
                await obterLikes(vid.id);


            const jaCurtiu =
                localStorage.getItem(
                    "like_video_" + vid.id
                ) === "true";


            const embed =
                converterParaEmbed(vid.video);


            const admin =
                professor
                    ? `
                        <div>
                            <button
                                onclick="editarVideo('${vid.id}')"
                                style="
                                    background:#374151;
                                    color:white;
                                    border:none;
                                    padding:2px 5px;
                                    border-radius:3px;
                                    cursor:pointer;
                                    font-size:11px;
                                ">
                                ✏️ Editar
                            </button>

                            <button
                                onclick="excluirVideo('${vid.id}')"
                                style="
                                    background:#b91c1c;
                                    color:white;
                                    border:none;
                                    padding:2px 5px;
                                    border-radius:3px;
                                    cursor:pointer;
                                    font-size:11px;
                                ">
                                🗑️ Excluir
                            </button>
                        </div>
                    `
                    : "";


            card.innerHTML = `

                <div>

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:flex-start;
                        margin-bottom:4px;
                    ">

                        <h3 style="
                            margin-top:0;
                            margin-bottom:6px;
                            color:#fff;
                            font-size:16px;
                        ">
                            ${escaparHTML(vid.titulo)}
                        </h3>

                        ${admin}

                    </div>


                    <iframe
                        width="100%"
                        height="180"
                        src="${escaparAtributo(embed)}"
                        style="
                            border:none;
                            border-radius:4px;
                        "
                        allowfullscreen>
                    </iframe>


                    <p style="
                        margin-top:8px;
                        margin-bottom:0;
                        font-size:14px;
                    ">
                        ${escaparHTML(vid.descricao || "")}
                    </p>

                </div>


                <div class="secao-comentarios-card">

                    <button
                        id="btn-${vid.id}"
                        onclick="curtir('${vid.id}')"
                        style="
                            background:${jaCurtiu ? "#dc2626" : "#2563eb"};
                            color:white;
                            border:none;
                            padding:5px 10px;
                            border-radius:4px;
                            cursor:pointer;
                            font-size:13px;
                        ">

                        ❤️ Curtir
                        (<span id="likes-${vid.id}">
                            ${likes}
                        </span>)

                    </button>


                    <div style="margin-top:8px;">

                        <div class="form-inputs-comentario">

                            <input
                                type="text"
                                id="autor-${vid.id}"
                                placeholder="Seu nome..."
                                style="
                                    width:32%;
                                    padding:4px 6px;
                                    border-radius:4px;
                                    border:1px solid #555;
                                    background:#222;
                                    color:white;
                                    font-size:13px;
                                ">


                            <input
                                type="text"
                                id="input-${vid.id}"
                                placeholder="Escreva um comentário..."
                                onkeypress="
                                    verificarEnter(
                                        event,
                                        'autor-${vid.id}',
                                        'input-${vid.id}',
                                        '${vid.id}'
                                    )
                                "
                                style="
                                    width:66%;
                                    padding:4px 6px;
                                    border-radius:4px;
                                    border:1px solid #555;
                                    background:#222;
                                    color:white;
                                    font-size:13px;
                                ">

                        </div>


                        <button

                                    'autor-${vid.id}',
                                    'input-${vid.id}',
                                    '${vid.id}'

                            style="
                                background:#16a34a;
                                color:white;
                                border:none;
                                padding:5px 8px;
                                border-radius:4px;

                    <div
                        id="lista-${vid.id}"
                        style="

                            text-align:left;

                    </div>

                </div>

            `;


            grid.appendChild(card);

            await carregarComentariosDoCard(vid.id);

        }


        secao.appendChild(grid);

        container.appendChild(secao);

    }

}

async function salvarNovoVideo() {

    if (!(await ehProfessor())) {

        alert("Acesso restrito ao professor.");

        return;

    }


    const categoria =
        document.getElementById("novo-categoria").value;

    const titulo =
        document.getElementById("novo-titulo").value.trim();

    const video =
        document.getElementById("novo-link").value.trim();

    const descricao =
        document.getElementById("novo-descricao").value.trim();


    if (!titulo || !video) {

        alert(
            "Preencha pelo menos o Título e o Link do Vídeo!"
        );

        return;

    }


    const novoId =
        "vid-" + Date.now();


    const { error } =
        await db
            .from("videos")
            .insert([{
                id: novoId,
                categoria,
                titulo,
                video,
                descricao
            }]);


    if (error) {

        alert(
            "Erro ao salvar vídeo: " +
            error.message
        );

        return;

    }


    document.getElementById("novo-titulo").value = "";
    document.getElementById("novo-link").value = "";
    document.getElementById("novo-descricao").value = "";

    document.getElementById("painel-admin").style.display =
        "none";


    await carregarVideos();

}

        alert("Acesso restrito ao professor.");

    }


    if (!confirm("Tem certeza que deseja apagar este vídeo?")) {
        return;
    }


    const { error } =
        await db
            .from("videos")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "Erro ao excluir vídeo: " +
            error.message
        );

        return;

    }


    await carregarVideos();

}

   EDITAR VÍDEO
========================================================= */

async function editarVideo(id) {

    if (!(await ehProfessor())) {

        alert("Acesso restrito ao professor.");

        return;

    }


    const {
        data,
        error
    } = await db
        .from("videos")
        .select("*")
        .eq("id", id)
        .maybeSingle();


    if (error || !data) {

        alert("Vídeo não encontrado.");

        return;

    }


    const titulo =
        prompt(
            "Edite o Título:",
            data.titulo
        );

    if (titulo === null) return;


    const link =
        prompt(
            "Edite o Link do YouTube:",
            data.video
        );

    if (link === null) return;


    const descricao =
        prompt(
            "Edite a Descrição:",
            data.descricao || ""
        );

    if (descricao === null) return;


    const { error: erroUpdate } =
        await db
            .from("videos")
            .update({
                titulo: titulo.trim(),
                video: link.trim(),
                descricao: descricao.trim()
            })
            .eq("id", id);


    if (erroUpdate) {

        alert(
            "Erro ao atualizar: " +
            erroUpdate.message
        );

        return;

    }


    await carregarVideos();

}


/* =========================================================
   COMENTÁRIOS
========================================================= */

function chaveComentario(id) {

    return "video:" + id;

}


async function comentar(
    idAutor,
    idInput,
    idVideo
) {

    const autorInput =
        document.getElementById(idAutor);

    const textoInput =
        document.getElementById(idInput);


    const autor =
        autorInput.value.trim() ||
        "Visitante";

    const texto =
        textoInput.value.trim();


    if (!texto) return;


    const { error } =
        await db
            .from("comentarios")
            .insert([{
                autor: autor,
                texto: texto,
                item_id: chaveComentario(idVideo)
            }]);


    if (error) {

        alert(
            "Erro ao enviar comentário: " +
            error.message
        );

        console.error(error);

        return;

    }


    textoInput.value = "";
    autorInput.value = "";


    await carregarComentariosDoCard(idVideo);

}


function verificarEnter(
    event,
    idAutor,
    idInput,
    idVideo
) {

    if (event.key === "Enter") {

        event.preventDefault();

        comentar(
            idAutor,
            idInput,
            idVideo
        );

    }

}


async function carregarComentariosDoCard(idVideo) {

    const lista =
        document.getElementById(
            "lista-" + idVideo
        );

    if (!lista) return;


    lista.innerHTML = "";


    const {
        data,
        error
    } = await db
        .from("comentarios")
        .select("*")
        .eq(
            "item_id",
            chaveComentario(idVideo)
        )
        .order(
            "criado_em",
            {
                ascending: true
            }
        );


    if (error) {

        console.warn(
            "Erro ao carregar comentários:",
            error
        );

        return;

    }


    for (const item of data || []) {

        adicionarElementoComentario(
            lista,
            item.autor || "Visitante",
            item.texto || "",
            calcularTempoRelativo(item.criado_em),
            idVideo,
            item.id
        );

    }

}

/* =========================================================
   TEMPO
========================================================= */

function calcularTempoRelativo(data) {

    const timestamp =
        new Date(data).getTime();

    if (isNaN(timestamp)) {
        return "agora";
    }


    const agora =
        Date.now();

    const segundos =
        Math.floor(
            (agora - timestamp) / 1000
        );


    if (segundos < 60) {
        return "agora mesmo";
    }


    const minutos =
        Math.floor(
            segundos / 60
        );


    if (minutos < 60) {

        return (
            "há " +
            minutos +
            (minutos === 1
                ? " minuto"
                : " minutos")
        );

    }


    const horas =
        Math.floor(
            minutos / 60
        );


    if (horas < 24) {

        return (
            "há " +
            horas +
            (horas === 1
                ? " hora"
                : " horas")
        );

    }


    const dias =
        Math.floor(
            horas / 24
        );


    return (
        "há " +
        dias +
        (dias === 1
            ? " dia"
            : " dias")
    );

}


/* =========================================================
   SEGURANÇA DO HTML
========================================================= */

function escaparHTML(valor) {

    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escaparAtributo(valor) {

    return escaparHTML(valor);

}
