<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sugestões - Química com Professor Wendel</title>

    <link rel="stylesheet" href="../css/style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .container-sugestoes {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #1e2621;
            border-radius: 12px;
            color: white;
            border: 1px solid #a3e4d7;
            font-family: Arial, sans-serif;
        }

        .container-sugestoes input,
        .container-sugestoes textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #2a352f;
            color: white;
            box-sizing: border-box;
        }

        .lista-sugestoes {
            margin-top: 30px;
        }

        .item-sugestao {
            background: #2a352f;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #00b4d8;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">

        <a href="../index.html"
           style="text-decoration: none; display: flex; align-items: center; gap: 10px; color: inherit;">

            <img src="../assets/imagens/logo/logo.png" alt="Logo">

            <span>Química com Professor Wendel</span>

        </a>

    </div>

    <nav>

        <a href="../index.html">Início</a>

        <a href="experimentos.html">Experimentos</a>

        <a href="videos.html">Vídeos</a>

        <a href="perguntas.html">Perguntas</a>

        <a href="professor.html">Professor</a>

        <a href="sugestoes.html">Sugestões</a>

        <a href="login.html"
           style="color: #a3e4d7; font-weight: bold;">
            🔑 Login
        </a>

    </nav>

</header>


<div class="container-sugestoes">

    <h2>💬 Envie sua Sugestão ou Dúvida</h2>

    <p>
        O Professor Wendel quer saber o que você gostaria de ver no site!
    </p>


    <label>Seu Nome (Opcional):</label>

    <input
        type="text"
        id="nome-aluno"
        placeholder="Ex: João Silva"
    >


    <label>Sua Sugestão:</label>

    <textarea
        id="texto-sugestao"
        rows="4"
        placeholder="Escreva sua sugestão de conteúdo..."
    ></textarea>


    <button
        onclick="enviarSugestao()"
        style="
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        "
    >
        Enviar Sugestão
    </button>


    <div
        id="painel-professor"
        style="
            display: none;
            margin-top: 40px;
            border-top: 1px solid #555;
            padding-top: 20px;
        "
    >

        <h3 style="color: #a3e4d7;">
            🔐 Painel do Professor: Sugestões Recebidas
        </h3>

        <div
            id="lista-sugestoes-admin"
            class="lista-sugestoes"
        >
            Carregando...
        </div>

    </div>

</div>


<footer>

    <p>Química com Professor Wendel</p>

</footer>


<script>

    /*
    =====================================================
    SUPABASE
    =====================================================
    */

    if (!window.sugestoesSupabase) {

        window.sugestoesSupabase = window.supabase.createClient(
            "https://ahstdxgglfgjfeuurkqg.supabase.co",

            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoc3RkeGdnbGZnamZldXVya3FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTY1ODIsImV4cCI6MjEwNDEzMjU4Mn0.4i7i3_w0n6VvrAXHduUMRKQPCQ6cR2SzAy7XCYtnUJY"
        );

    }


    /*
    =====================================================
    VERIFICAR LOGIN
    =====================================================
    */

    document.addEventListener("DOMContentLoaded", async function () {

        try {

            const resultado =
                await window.sugestoesSupabase.auth.getSession();

            const session =
                resultado.data.session;

const EMAIL_PROFESSOR = "EMAIL_DO_PROFESSOR_AQUI";

if (session && session.user.email === EMAIL_PROFESSOR) {

    document
        .getElementById("painel-professor")
        .style.display = "block";

    carregarSugestoesAdmin();

} else {

    document
        .getElementById("painel-professor")
        .style.display = "none";

}

        } catch (erro) {

            console.error(
                "Erro ao verificar login:",
                erro
            );

        }

    });


    /*
    =====================================================
    ENVIAR SUGESTÃO
    =====================================================
    */

    async function enviarSugestao() {

        const nome =
            document
                .getElementById("nome-aluno")
                .value
                .trim() || "Anônimo";


        const mensagem =
            document
                .getElementById("texto-sugestao")
                .value
                .trim();


        if (!mensagem) {

            alert(
                "Escreva uma mensagem antes de enviar!"
            );

            return;
        }


        try {

            const resultado =
                await window.sugestoesSupabase
                    .from("sugestoes")
                    .insert([
                        {
                            nome: nome,
                            mensagem: mensagem
                        }
                    ]);


            if (resultado.error) {

                console.error(
                    resultado.error
                );

                alert(
                    "Erro ao enviar: " +
                    resultado.error.message
                );

                return;
            }


            alert(
                "Sugestão enviada com sucesso! Obrigado."
            );


            document
                .getElementById("texto-sugestao")
                .value = "";


            document
                .getElementById("nome-aluno")
                .value = "";


        } catch (erro) {

            console.error(erro);

            alert(
                "Ocorreu um erro ao enviar a sugestão."
            );

        }

    }


    /*
    =====================================================
    CARREGAR SUGESTÕES
    =====================================================
    */

    async function carregarSugestoesAdmin() {

        const container =
            document.getElementById(
                "lista-sugestoes-admin"
            );


        try {

            const resultado =
                await window.sugestoesSupabase
                    .from("sugestoes")
                    .select("*")
                    .order(
                        "criado_em",
                        {
                            ascending: false
                        }
                    );


            const data =
                resultado.data;

            const error =
                resultado.error;


            if (error) {

                console.error(error);

                container.innerHTML =
                    "Erro ao carregar sugestões: " +
                    error.message;

                return;
            }


            if (!data || data.length === 0) {

                container.innerHTML =
                    "<p>Nenhuma sugestão recebida ainda.</p>";

                return;
            }


            container.innerHTML =
                data.map(function (s) {

                    return `

                        <div class="item-sugestao">

                            <strong>
                                De: ${s.nome || "Anônimo"}
                            </strong>

                            <p style="
                                margin: 5px 0 10px 0;
                            ">
                                ${s.mensagem}
                            </p>

                            <small style="
                                color: #aaa;
                            ">
                                Enviado em:
                                ${s.criado_em
                                    ? new Date(
                                        s.criado_em
                                      ).toLocaleDateString()
                                    : "Data não disponível"
                                }
                            </small>

                            <br>

                            <button
                                onclick="excluirSugestao('${s.id}')"
                                style="
                                    background: #dc3545;
                                    color: white;
                                    border: none;
                                    padding: 4px 8px;
                                    border-radius: 4px;
                                    cursor: pointer;
                                    margin-top: 8px;
                                "
                            >
                                Excluir
                            </button>

                        </div>

                    `;

                }).join("");


        } catch (erro) {

            console.error(erro);

            container.innerHTML =
                "Erro inesperado ao carregar sugestões.";

        }

    }


    /*
    =====================================================
    EXCLUIR SUGESTÃO
    =====================================================
    */

    async function excluirSugestao(id) {

        if (
            !confirm(
                "Deseja apagar esta sugestão?"
            )
        ) {

            return;

        }


        try {

            const resultado =
                await window.sugestoesSupabase
                    .from("sugestoes")
                    .delete()
                    .eq("id", id);


            if (resultado.error) {

                console.error(
                    resultado.error
                );

                alert(
                    "Erro ao excluir: " +
                    resultado.error.message
                );

                return;

            }


            carregarSugestoesAdmin();


        } catch (erro) {

            console.error(erro);

            alert(
                "Ocorreu um erro ao excluir."
            );

        }

    }

</script>

</body>

</html>
