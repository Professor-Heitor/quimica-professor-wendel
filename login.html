<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login do Professor - Química com Professor Wendel</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    .container-login { max-width: 400px; margin: 80px auto; padding: 30px; background: #1e2621; border-radius: 12px; color: white; border: 1px solid #a3e4d7; font-family: Arial, sans-serif; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .container-login h2 { text-align: center; color: #a3e4d7; margin-bottom: 20px; }
    .container-login label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; }
    .container-login input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #555; background: #2a352f; color: white; box-sizing: border-box; }
    .container-login button { width: 100%; margin-top: 25px; background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.3s; }
    .container-login button:hover { background: #218838; }
    .voltar-home { text-align: center; margin-top: 15px; }
    .voltar-home a { color: #00b4d8; text-decoration: none; }
    .voltar-home a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="container-login">
    <h2>🔐 Painel Restrito</h2>
    <p style="text-align: center; font-size: 14px; color: #ccc;">Acesso exclusivo para o Professor Wendel.</p>
    
    <label>E-mail:</label>
    <input type="email" id="email-login" placeholder="seu-email@dominio.com">
    
    <label>Senha:</label>
    <input type="password" id="senha-login" placeholder="Sua senha secreta">
    
    <button onclick="fazerLogin()">Entrar</button>

    <div class="voltar-home">
        <a href="../index.html">← Voltar para a página inicial</a>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://ahstdxgglfgjfeuurkqg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoc3RkeGdnbGZnamZldXVya3FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTY1ODIsImV4cCI6MjEwNDEzMjU4Mn0.4i7i3_w0n6VvrAXHduUMRKQPCQ6cR2SzAy7XCYtnUJY";

    // Criamos o cliente usando um nome único para evitar conflitos
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
            document.getElementById('painel-professor').style.display = 'block';
            carregarSugestoesAdmin();
        }
    });

    async function enviarSugestao() {
        const nome = document.getElementById('nome-aluno').value.trim() || "Anônimo";
        const mensagem = document.getElementById('texto-sugestao').value.trim();

        if (!mensagem) {
            alert("Escreva uma mensagem antes de enviar!");
            return;
        }

        const { error } = await db
            .from('sugestoes')
            .insert([{ nome, mensagem }]);

        if (error) {
            alert("Erro ao enviar: " + error.message);
        } else {
            alert("Sugestão enviada com sucesso! Obrigado.");
            document.getElementById('texto-sugestao').value = "";
            document.getElementById('nome-aluno').value = "";
        }
    }

    async function carregarSugestoesAdmin() {
        const { data, error } = await db
            .from('sugestoes')
            .select('*')
            .order('criado_em', { ascending: false });

        const container = document.getElementById('lista-sugestoes-admin');
        if (error) {
            container.innerHTML = "Erro ao carregar sugestões.";
            return;
        }

        if (data.length === 0) {
            container.innerHTML = "<p>Nenhuma sugestão recebida ainda.</p>";
            return;
        }

        container.innerHTML = data.map(s => `
            <div class="item-sugestao">
                <strong>De: ${s.nome}</strong>
                <p style="margin: 5px 0 10px 0;">${s.mensagem}</p>
                <small style="color: #aaa;">Enviado em: ${new Date(s.criado_em).toLocaleDateString()}</small>
                <br>
                <button onclick="excluirSugestao('${s.id}')" style="background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; margin-top: 8px;">Excluir</button>
            </div>
        `).join('');
    }

    async function excluirSugestao(id) {
        if (!confirm("Deseja apagar esta sugestão?")) return;
        const { error } = await db.from('sugestoes').delete().eq('id', id);
        if (error) {
            alert("Erro ao excluir: " + error.message);
        } else {
            carregarSugestoesAdmin();
        }
    }
</script>

</body>
</html>
